<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Simple Counter</h1>
    <p>Count: <span id="count">0</span></p>

    <button onclick="getPost()">REST EndPoint</button>

    <button onclick="increment()">Click Me</button>
    

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function getPost() {

            const response  =  fetch(
                "https://jsonplaceholder.typicode.com/posts/1"
            )

            const post = response.json();

            console.log(post);
        }


    </script>
</body>
</html>
