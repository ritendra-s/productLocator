<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Simple Counter 2</h1>
    <p>Count: <span id="count">0</span></p>

    <button onclick="getPost()">REST EndPoint</button>

    <button onclick="increment()">Click Me</button>


    <script>

        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function getPost() {

            alert('Output of REST call 1 !!');
            const response  =  fetch(
                "https://jsonplaceholder.typicode.com/posts/1"
            )

            alert('Output of REST call 2a !!');
            alert (response.json());
            //const post = response.json();

            alert('Output of REST call 2 !!');
            document.writeln('Output of REST call');
            // console.log(post);
            // document.writeln(post);
        }
        alert('Output of REST call 3 !!');
    </script>
</body>
</html>
